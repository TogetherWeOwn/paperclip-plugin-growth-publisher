# Organisation template: advisory only; never required for merge.
name: pr-size
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional pull request number (blank runs weekly tally)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pr-size:
    if: github.event_name == 'pull_request' || inputs.pr_number != ''
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: TogetherWeOwn/.github/.github/workflows/pr-size.yml@bf952239a4ae65ab09f1944e2501f018fd04f384
    with:
      pr-number: ${{ inputs.pr_number || '' }}
      exclude-extra: ''
  pr-size-weekly:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == '')
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: TogetherWeOwn/.github/.github/workflows/pr-size-weekly.yml@bf952239a4ae65ab09f1944e2501f018fd04f384
